<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameZone Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#e9e5d9;font:16px system-ui,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,calc((100vw - 1050px)/2));background:#14151c;border-bottom:1px solid #5d462c}
a{color:#f4c66f;text-decoration:none}.brand{color:#ffd378;font-weight:900;letter-spacing:2px}
main{max-width:1050px;margin:20px auto;padding:0 14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:clamp(23px,4vw,36px);color:#ffd27d;margin:8px 0}.hint{color:#aab4c7;margin:8px 0 18px}
.stage{position:relative;background:#0e1220;border:2px solid #99733e;border-radius:16px;overflow:hidden;box-shadow:0 12px 50px #0009}
canvas{display:block;width:100%;aspect-ratio:800/480;touch-action:none;cursor:crosshair}
.hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;color:#fff;font-weight:800;text-shadow:0 2px 4px #000;background:#090b0d44;padding:5px 10px;border-radius:8px;pointer-events:none}
button{border:1px solid #a67e43;border-radius:10px;background:#282315;color:#ffdda2;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:#584421}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.touch{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;margin:15px 0}
.touch button{min-width:58px;min-height:53px;touch-action:none;user-select:none;background:#333144}
.notice{color:#d1bf98;border:1px solid #49391f;border-radius:12px;padding:12px;margin-top:15px}
</style></head><body><header><a class="brand" href="./">🎮 GAMEZONE</a><a href="./">← Katalogga qaytish</a></header>
<main><div class="top"><h1 id="title">GameZone Arcade</h1><div class="toolbar"><button id="restart">↻ Restart</button><button id="pause">⏸ Pause</button><button id="fullscreen">⛶ Fullscreen</button></div></div>
<p class="hint" id="hint"></p><div class="stage" id="stage"><canvas id="screen" width="800" height="480" tabindex="0"></canvas><div class="hud"><span id="hud1"></span><span id="hud2"></span></div></div>
<div class="touch"><button data-key="arrowleft">◀</button><button data-key="arrowup">▲</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button><button data-key="space">⚡ Harakat / otish</button></div>
<p class="notice">Original GameZone arcade o‘yinlari. Kompyuterda klaviatura orqali, telefonda pastdagi tugmalar orqali o‘ynash mumkin. O‘yinlar tashqi saytga yo‘naltirmaydi.</p></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),W=800,H=480;
const key={};let running=true,over=false,last=0,clock=0,points=0,state={},time=0;
const qp=new URLSearchParams(location.search),m=qp.get('mode'),modes=['racing','action','horror','football','puzzle'],mode=modes.includes(m)?m:'racing';
const title={racing:'🏎️ Neon Highway',action:'🔫 Arena Survivor',horror:'👻 Haunted Labyrinth',football:'⚽ Penalty Master',puzzle:'🐍 Neon Snake'};
const help={racing:'← → yoki A/D: mashinani boshqar. To‘siqlardan qoch, imkon qadar uzoqqa bor!',action:'WASD / strelkalar: yurish. Sichqoncha: nishonga olish. Bosib turish yoki SPACE: otish. Dushmanlardan qoch!',horror:'WASD / strelkalar: yurish. 4 ta kalitni top, so‘ng yashil chiqishga bor. Arvohdan qoch!',football:'← →: yo‘nalish, SPACE: tepish. Darvozabonni aldab gol ur!',puzzle:'WASD / strelkalar: ilonni boshqar. Mevani ye, devor va o‘zingga urilma!'};
document.getElementById('title').textContent=title[mode];document.getElementById('hint').textContent=help[mode];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),dist=(x,y,a,b)=>Math.hypot(x-a,y-b);
function msg(a,b){document.getElementById('hud1').textContent=a;document.getElementById('hud2').textContent=b}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function line(x,y,a,b,col,width=3){ctx.strokeStyle=col;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke()}
function label(t,x,y,size=20,col='#fff',align='left'){ctx.fillStyle=col;ctx.font='bold '+size+'px system-ui';ctx.textAlign=align;ctx.fillText(t,x,y);ctx.textAlign='left'}
function done(text){over=true;state.endText=text}
function reset(){points=0;time=0;clock=0;over=false;running=true;last=performance.now();Object.keys(key).forEach(k=>delete key[k]);
if(mode==='racing')state={car:400,traffic:[],spawn:0,speed:280,hearts:3,inv:0,scroll:0};
if(mode==='action')state={p:{x:400,y:240,hp:100},bullets:[],enemies:[],spawn:0,shot:0,mouse:{x:650,y:240},wave:1};
if(mode==='horror'){let walls=[];for(let y=0;y<12;y++)for(let x=0;x<20;x++){if(x===0||x===19||y===0||y===11||((x%4===0)&&(y>1&&y<10)&&(y%3!==0)))walls.push([x,y])}state={p:{x:60,y:60},ghost:{x:710,y:410},walls,keys:[[150,100],[650,80],[180,370],[620,360]],found:[],exit:[745,55],safe:2};}
if(mode==='football')state={aim:0,keeper:0,keeperDir:1,balls:10,goal:0,shot:null};
if(mode==='puzzle')state={snake:[[10,7],[9,7],[8,7]],direction:[1,0],next:[1,0],food:[15,8],step:0};
msg('Hisob: 0','');
}
function input(dt){return [(key.arrowright||key.d?1:0)-(key.arrowleft||key.a?1:0),(key.arrowdown||key.s?1:0)-(key.arrowup||key.w?1:0)]}
function racing(dt){const s=state;const dir=input(dt);s.car=clamp(s.car+dir[0]*420*dt,230,570);s.speed=Math.min(570,s.speed+dt*4);s.scroll+=s.speed*dt;s.spawn-=dt;if(s.spawn<=0){s.spawn=rand(.55,1.2);s.traffic.push({x:[275,400,525][Math.floor(rand(0,3))],y:-70,speed:rand(75,210),color:['#f54f72','#55c3fa','#e4c957'][Math.floor(rand(0,3))]})}
s.inv=Math.max(0,s.inv-dt);rect(0,0,W,H,'#0d1520');rect(180,0,440,H,'#292c3c');rect(184,0,6,H,'#f4cc64');rect(610,0,6,H,'#f4cc64');for(let y=-60;y<540;y+=95)for(let x of [325,475])rect(x,y+(s.scroll%95),6,50,'#b2b7c7');
for(const e of s.traffic){e.y+=(s.speed+e.speed*.4)*dt;rect(e.x-27,e.y-32,54,70,e.color);rect(e.x-17,e.y-22,34,18,'#0c1828');if(s.inv===0&&Math.abs(e.x-s.car)<48&&Math.abs(e.y-385)<54){s.hearts--;s.inv=1.4;e.y=H+100;if(s.hearts===0)done('💥 GAME OVER')}}s.traffic=s.traffic.filter(x=>x.y<H+80);
if(Math.floor(s.scroll/30)>points)points=Math.floor(s.scroll/30);if(s.inv===0||Math.floor(time*15)%2===0){rect(s.car-27,355,54,77,'#e8b652');rect(s.car-18,363,36,21,'#122f46');rect(s.car-18,413,36,9,'#ff584f')}
msg('Masofa: '+points+' m','❤️ '+s.hearts+' | Tezlik '+Math.floor(s.speed/4));}
function action(dt){const s=state,p=s.p,move=input(dt);const n=Math.hypot(...move)||1;p.x=clamp(p.x+move[0]/n*245*dt,18,W-18);p.y=clamp(p.y+move[1]/n*245*dt,18,H-18);
s.spawn-=dt;s.shot-=dt;s.wave=1+Math.floor(time/18);if(s.spawn<=0){s.spawn=Math.max(.2,.92-s.wave*.05);let side=Math.floor(rand(0,4));s.enemies.push({x:side===0?-20:side===1?820:rand(0,800),y:side===2?-20:side===3?500:rand(0,480),hp:1+Math.floor(s.wave/4)})}
if((key.space||key[' ']||key.mouse)&&s.shot<=0){let dx=s.mouse.x-p.x,dy=s.mouse.y-p.y;let nearest=s.enemies.reduce((a,e)=>!a||dist(e.x,e.y,p.x,p.y)<dist(a.x,a.y,p.x,p.y)?e:a,null);if(key.space&&nearest){dx=nearest.x-p.x;dy=nearest.y-p.y}const len=Math.hypot(dx,dy)||1;s.bullets.push({x:p.x,y:p.y,vx:dx/len*610,vy:dy/len*610});s.shot=.16}
rect(0,0,W,H,'#101a26');for(let i=0;i<40;i++){rect(i*43%800,(i*97)%480,2,2,'#344052')}for(let b of s.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;circle(b.x,b.y,5,'#ffda75')}for(const e of s.enemies){const a=Math.atan2(p.y-e.y,p.x-e.x),v=65+s.wave*8;e.x+=Math.cos(a)*v*dt;e.y+=Math.sin(a)*v*dt;circle(e.x,e.y,17,'#ec5560');circle(e.x-5,e.y-4,3,'#fff');circle(e.x+5,e.y-4,3,'#fff');if(dist(e.x,e.y,p.x,p.y)<26){p.hp-=dt*28;if(p.hp<=0)done('☠️ YOU DIED')}}for(let b of s.bullets)for(let e of s.enemies)if(!b.hit&&e.hp>0&&dist(b.x,b.y,e.x,e.y)<20){b.hit=true;e.hp--;if(e.hp===0)points+=10}
s.enemies=s.enemies.filter(e=>e.hp>0);s.bullets=s.bullets.filter(b=>!b.hit&&b.x>-10&&b.x<810&&b.y>-10&&b.y<490);
circle(p.x,p.y,17,'#75caff');circle(p.x,p.y,8,'#174e71');rect(20,445,200,14,'#343743');rect(20,445,clamp(p.hp,0,100)*2,14,'#65d99d');
msg('🏆 '+points+' | WAVE '+s.wave,'❤️ '+Math.max(0,Math.round(p.hp))+'%');}
function horror(dt){const s=state,p=s.p,d=input(dt);let nx=p.x+d[0]*175*dt,ny=p.y+d[1]*175*dt;
const blocked=(x,y)=>s.walls.some(w=>x>w[0]*40-10&&x<w[0]*40+50&&y>w[1]*40-10&&y<w[1]*40+50);
if(!blocked(nx,p.y))p.x=clamp(nx,18,W-18);if(!blocked(p.x,ny))p.y=clamp(ny,18,H-18);
const gx=s.ghost.x,gy=s.ghost.y,ang=Math.atan2(p.y-gy,p.x-gx);if(time>3){s.ghost.x+=Math.cos(ang)*(47+points*3)*dt;s.ghost.y+=Math.sin(ang)*(47+points*3)*dt}
rect(0,0,W,H,'#10131f');for(const w of s.walls)rect(w[0]*40,w[1]*40,40,40,'#464052');
for(let i=0;i<s.keys.length;i++){let k=s.keys[i];if(!s.found.includes(i)){label('🗝️',k[0]-12,k[1]+9,27);if(dist(p.x,p.y,...k)<25){s.found.push(i);points++;}}}
rect(720,27,48,55,s.found.length===4?'#39bb78':'#79543b');label('🚪',726,68,34);
if(s.found.length===4&&dist(p.x,p.y,744,55)<45)done('🏆 YOU ESCAPED!');
label('👻',s.ghost.x-18,s.ghost.y+10,37);circle(p.x,p.y,12,'#f5d58e');
if(dist(p.x,p.y,s.ghost.x,s.ghost.y)<25)done('👻 ARVOH SIZNI TUTDI!');
const shadow=ctx.createRadialGradient(p.x,p.y,45,p.x,p.y,190);shadow.addColorStop(0,'#0000');shadow.addColorStop(1,'#020409f7');rect(0,0,W,H,shadow);msg('🗝️ '+s.found.length+'/4 kalit','🚪 Chiqishni top!');}
function football(dt){const s=state;const d=input(dt);s.aim=clamp(s.aim+d[0]*dt*1.8,-1,1);s.keeper+=dt*s.keeperDir*1.6;if(Math.abs(s.keeper)>.85)s.keeperDir*=-1;
rect(0,0,W,H,'#2c7544');for(let y=0;y<H;y+=70)rect(0,y,W,32,'#2a6a3e');rect(160,45,480,180,'#f0efe6');rect(169,54,462,163,'#245d40');for(let x=190;x<=610;x+=35)line(x,55,x,217,'#a0c0ac',1);for(let y=58;y<225;y+=30)line(170,y,630,y,'#a0c0ac',1);
const keeperX=400+s.keeper*180;label('🧤',keeperX-24,170,48);circle(400,408,31,'#f8f4e8');label('⚽',377,423,46);const target=400+s.aim*200;line(400,374,target,125,'#f9d66b',4);circle(target,120,9,'#ffc86e');
if(s.shot){s.shot.timer+=dt;if(s.shot.timer>.55){if(Math.abs(s.shot.target-s.shot.keeper)>90){s.goal++;points++;s.shot.text='⚽ GOOOL!'}else s.shot.text='🧤 SEYV!';s.balls--;const text=s.shot.text;s.shot=null;if(s.balls<=0)done('🏁 PENALTILAR TUGADI');state.flash=text;state.flashT=.8}}
if(s.flashT>0)s.flashT-=dt;if(s.flashT>0)label(s.flash,400,275,32,'#ffe58e','center');
msg('⚽ Gollar: '+points,'Qolgan zarba: '+s.balls);}
function snake(dt){const s=state,d=input(dt);let nd=d[0]!==0?[d[0],0]:d[1]!==0?[0,d[1]]:null;if(nd&&!(nd[0]===-s.direction[0]&&nd[1]===-s.direction[1]))s.next=nd;
s.step+=dt;if(s.step<.13)return;s.step=0;s.direction=s.next;const h=s.snake[0],next=[h[0]+s.direction[0],h[1]+s.direction[1]];if(next[0]<0||next[0]>=25||next[1]<0||next[1]>=15||s.snake.some(p=>p[0]===next[0]&&p[1]===next[1])){done('🐍 GAME OVER');return}s.snake.unshift(next);
if(next[0]===s.food[0]&&next[1]===s.food[1]){points+=10;let x,y;do{x=Math.floor(rand(0,25));y=Math.floor(rand(0,15))}while(s.snake.some(p=>p[0]===x&&p[1]===y));s.food=[x,y]}else s.snake.pop();
}
function drawSnake(){rect(0,0,W,H,'#131e2a');for(let x=0;x<25;x++)for(let y=0;y<15;y++)rect(x*32+1,y*32+1,30,30,'#1a2a34');for(let i=state.snake.length-1;i>=0;i--){const p=state.snake[i];rect(p[0]*32+2,p[1]*32+2,28,28,i===0?'#fee17e':'#47cb8a')}circle(state.food[0]*32+16,state.food[1]*32+16,12,'#ff6270');msg('🏆 '+points,'🐍 Uzunlik: '+state.snake.length)}
function render(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;if(running&&!over){time+=dt;if(mode==='racing')racing(dt);if(mode==='action')action(dt);if(mode==='horror')horror(dt);if(mode==='football')football(dt);if(mode==='puzzle')snake(dt)}
if(mode==='puzzle')drawSnake();if(!running||over){rect(0,0,W,H,'#0008');label(over?state.endText:'⏸ PAUSE',W/2,225,34,'#ffe09a','center');label('Restart tugmasi bilan qayta boshlang',W/2,265,18,'#fff','center')}requestAnimationFrame(render)}
function shoot(){if(mode==='football'&&running&&!over&&!state.shot&&state.balls>0)state.shot={target:400+state.aim*200,keeper:400+state.keeper*180,timer:0};if(mode==='action')key.space=true}
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();key[k===' '?'space':k]=true;if(k===' '&&!e.repeat)shoot();if(k==='escape')running=!running});
document.addEventListener('keyup',e=>{key[e.key===' '?'space':e.key.toLowerCase()]=false});
canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect();if(state.mouse){state.mouse.x=(e.clientX-r.left)*W/r.width;state.mouse.y=(e.clientY-r.top)*H/r.height}});
canvas.addEventListener('pointerdown',e=>{if(mode==='action')key.mouse=true;if(mode==='football')shoot()});window.addEventListener('pointerup',()=>key.mouse=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();key[k]=true;if(k==='space')shoot()};const up=e=>{e.preventDefault();key[k]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
document.getElementById('restart').onclick=reset;document.getElementById('pause').onclick=()=>{running=!running;document.getElementById('pause').textContent=running?'⏸ Pause':'▶ Continue'};document.getElementById('fullscreen').onclick=()=>{const st=document.getElementById('stage');if(!document.fullscreenElement)st.requestFullscreen?.();else document.exitFullscreen?.()};
reset();requestAnimationFrame(render);
})();
</script></body></html>
